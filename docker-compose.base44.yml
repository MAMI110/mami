services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - pydeps:/pydeps
    environment:
      - PORT=3000
      - PYTHONPATH=/pydeps
      - PYTHONUNBUFFERED=1
      - LUNEL_PUBLIC_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    ports: ["3000:3000"]
    command: ["sh","-ec","pip install -q --target /pydeps -r requirements.txt && exec python main.py"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure
volumes:
  pydeps:
